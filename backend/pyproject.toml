[project]
name = "campusbite-ai-backend"
version = "0.1.0"
description = "AI-powered, WhatsApp-first food pre-booking platform for university campuses."
requires-python = ">=3.11,<3.12"
readme = "README.md"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "A",   # flake8-builtins
]
ignore = ["B008"]  # allow FastAPI's Depends(...) in default arguments

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------
# Mypy (static typing)
# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["faiss.*", "sentence_transformers.*", "google.generativeai.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
